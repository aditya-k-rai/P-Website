<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>4Track - Open-Source 4-Track Recorder</title>
    <script type="module" crossorigin src="./assets/index-B2VAyJ0y.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Bzkj7kAs.css">
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function () {
        function normalizeWheelDelta(event) {
          var unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerHeight : 1;
          return { x: event.deltaX * unit, y: event.deltaY * unit };
        }

        window.addEventListener('wheel', function (event) {
          if (!window.parent || window.parent === window) return;
          var delta = normalizeWheelDelta(event);
          event.preventDefault();
          window.parent.postMessage({
            type: 'portfolio-cassette-wheel',
            deltaX: delta.x,
            deltaY: delta.y
          }, '*');
        }, { passive: false });
      })();
    </script>
  </body>
</html>
